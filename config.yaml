# LinkedIn-only job-post scan config.
# Edit queries / keywords / locations to taste — no code changes needed.

browser:
  channel: chrome          # use real installed Chrome, not bundled Chromium
  profile_dir: profile/linkedin
  headless: false          # must stay false: Task Scheduler needs an interactive desktop session

# When true, clicks each new post's "..." menu -> "Copy link to post" to get
# the real post permalink (needed for posts with no email - otherwise the
# only link available is the author/company profile, not the actual post).
# This is a new interaction type beyond scrolling/reading, so it's a toggle:
# set false to fall back to the author/company profile link only.
capture_post_links: true
# Safety cap: even with capture_post_links on, stop clicking after this many
# permalink captures within a single query. A query's volume can spike
# unexpectedly (one test run hit 234 posts for a single phrase) - this
# bounds how much "..." menu interaction happens in a worst case.
# Lowered from 15 to 8 on 2026-10-07: that day's run fired all 15 captures
# within about a minute (each only 0.8-1.8s apart at the time), right before
# LinkedIn flagged "unusual search traffic" on the very next query. The
# per-capture delay was widened to 2.0-4.5s in linkedin.py at the same time;
# this cap shortens how long that rapid open-menu/copy-link/clipboard-read
# pattern runs in total.
max_permalink_captures_per_query: 8

# Once a job opening (keyed by contact email, or company+role if no email)
# has been shown in the output, suppress it from showing again for this many
# days even if a different person reposts it - prevents the same opening
# resurfacing daily. Tracked in reported.json.
dedup_window_days: 7

window_hours: 24

queries:
  - "hiring for java developer"
  - "hiring for spring boot"
  - "hiring for genai engineer"
  - "hiring for backend developer"
  - "hiring for langchain"
  - "hiring for agentic ai"
  - "hiring for llm engineer"
  - "urgent hiring java developer"
  - "urgent hiring spring boot developer"
  - "hiring for mcp"
  - "hiring for langgraph"
  - "hiring for rag engineer"

# Both ends are enforced: a post whose lowest stated requirement is above
# max_years is dropped (too senior), and one whose highest stated
# requirement is below min_years is dropped (fresher/junior-only - previously
# not enforced at all, so e.g. "0-2 yrs" posts could slip through).
experience:
  min_years: 3
  max_years: 7

include_keywords:
  - java
  - spring
  - spring boot
  - backend
  - genai
  - langchain
  - langgraph
  - agentic
  - llm
  - mcp
  - rag
  - model context protocol

# Substring match anywhere in the post text -> post is dropped.
exclude_keywords:
  - c2c
  - w2
  - h1b
  - job seeker
  - looking for job
  - looking for opportunities
  - intern
  - internship
# Countries outside India - a post mentioning one of these is dropped UNLESS
# it's explicitly WFH/remote-from-India (bare "remote" alone does NOT
# qualify - that's the word that let Canada/Pakistan/Singapore posts slip
# through before, since "remote within Canada" also says "remote"; it needs
