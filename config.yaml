# Weaker foreign signals: US cities/states that also appear inside company
# names on genuine India postings (Texas Instruments, Boston Consulting
# Group, New York Life...). A post mentioning one is dropped only if it has
# NO Indian city/state anywhere in it. ("jakarta" is deliberately absent from
# both lists: "Jakarta EE" is a core Java term in many on-target posts.)
foreign_weak_signals:
  - new york
  - san francisco
  - texas
  - california
  - new jersey
  - chicago
  - seattle
  - atlanta
  - boston

# Role-title stack filter (checked against the extracted ROLE only, anywhere
# in the title - exclude_role_prefixes below only sees the start, so "Sr.
# Backend .NET Developer" slipped through). A role naming one of these is
# dropped unless it ALSO names something from role_keep_keywords, so
# "Java Full Stack (Java + Angular)" survives but "Node.js Backend Developer"
# does not.
exclude_role_keywords:
  - .net
  - dotnet
  - node.js
  - nodejs
  - node js
  - node
  - php
  - ruby
  - golang
  - c#
  - angular
  - react
  - react.js
  - flutter
  - android
  - ios
  - salesforce
  - sap
  - mern
  - mean
role_keep_keywords:
  - java
  - spring
  - python
  - ai
  - genai
  - agentic
  - llm
  - langchain
  - langgraph
  - mcp
  - rag

# Posts asking the candidate to pay anything (registration/processing fee,
# refundable deposit, etc.) are dropped outright, regardless of score.
# Falls back to classify.py's SCAM_KEYWORDS if this is left empty/removed.
scam_keywords:
  - charges applicable
  - registration fee
  - registration charges
  - processing fee
  - security deposit
  - refundable deposit
  - refundable fee
  - pay to apply
  - token amount
  - advance payment
  - small fee
  - nominal fee
  - one-time fee

# If the extracted ROLE starts with any of these -> post is dropped.
# (checked against the parsed role, not the raw post text)
exclude_role_prefixes:
  - angular
  - react
  - .net
  - dotnet
  - lead
  - manager
  - architect

# Location filtering is now handled in code (classify.py's STATE_PATTERNS +
# foreign_country_signals above), covering all Indian states/UTs plus the
# WFH-from-India exception for foreign-client postings. No config list here
# needed - edit STATE_PATTERNS directly if a city/region is missing.

skip_companies: []

# max_scroll_steps lowered from 30 to 15 on 2026-10-08. Evidence from the
# 2026-10-06/07/08 logs ruled out in-session click/scroll pacing as the
# cause of the "unusual search traffic" block (the 10-06 evening run was
# faster-paced AND pulled more raw posts per query than the two days that
# got blocked, and still went through clean) - so this isn't about how fast
# we click within one query. External research on LinkedIn's automation
# detection points to cumulative daily/weekly activity volume vs. the
# account's historical baseline as the real signal, not per-session
# micro-timing. This account has been running ~12 keyword searches with
# deep scrolling every day for a week (plus a same-day double run on
# 10-06), which is a large, sustained jump from a normal browsing pattern.
# Halving the scroll cap halves the worst-case raw-post volume per query
# (and therefore per day) as a direct lever on that signal. Pair this with
# NOT running more than once a day, and taking occasional days off entirely
# - no in-page timing fix addresses a cumulative, account-level pattern.
pacing:
  scroll_delay_min: 4
  scroll_delay_max: 9
  query_delay_min: 20
  query_delay_max: 40
  max_scroll_steps: 15
  stale_scroll_limit: 3

# Phrases checked (case-insensitive) against the full page text after every
# navigation/scroll. Any match stops the run immediately.
block_signals:
  - unusual activity
  - unusual search traffic
  - search activity on your account has been paused
  - we've restricted
  - checkpoint/challenge
  - commercial use limit
  - verify you're not a robot
  - security verification

# Apply-link analysis (links.py): posts without an email usually apply via a
# link, mostly opaque lnkd.in shorteners. When on, each surviving post's links
# are resolved (shortener hosts only, logged-out, cached in link_cache.json)
# and classified as application form / company ATS / LinkedIn job / job board
# / community / aggregator, so the report shows the real apply path.
resolve_links: true
max_link_resolutions_per_run: 60
